<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Nightmare Clock</title>
  <style>
    :root {
      --bg-color: #08060c;
      --accent-purple: #9d4edd;
      --accent-red: #ff0055;
      --accent-gold: #ffb703;
      --panel-bg: rgba(18, 12, 28, 0.92);
      --font-family: 'Cinzel', 'Georgia', serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: var(--bg-color);
      color: #e0e0e0;
      font-family: var(--font-family);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Screen Flash FX for Triggers */
    #flash-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle, rgba(255,0,85,0.6) 0%, rgba(0,0,0,0) 80%);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.1s ease-out;
      z-index: 100;
    }

    /* Ambient Background Atmosphere */
    .vignette {
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, rgba(157, 78, 221, 0.08) 0%, rgba(5, 3, 8, 0.95) 80%);
      pointer-events: none;
    }

    /* Main Clock Container */
    #clock-viewport {
      position: relative;
      width: min(85vh, 85vw);
      height: min(85vh, 85vw);
      display: flex;
      align-items: center;
      justify-content: center;
      filter: drop-shadow(0 0 25px rgba(157, 78, 221, 0.25));
    }

    /* Clock Layers */
    .clock-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Fallback Clock Face Canvas */
    #fallback-face {
      width: 100%;
      height: 100%;
      border-radius: 50%;
    }

    .hand-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      transform-origin: 50% 50%;
      transition: transform 0.05s linear;
    }

    /* Player Token Outer Ring Display */
    #player-ring {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      pointer-events: none;
    }

    .player-slot {
      position: absolute;
      width: 60px;
      height: 60px;
      margin-left: -30px;
      margin-top: -30px;
      border-radius: 50%;
      background: rgba(20, 10, 35, 0.85);
      border: 2px solid var(--accent-purple);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-weight: bold;
      font-size: 0.85rem;
      text-align: center;
      box-shadow: 0 0 12px rgba(157, 78, 221, 0.4);
      transition: all 0.3s ease;
      text-shadow: 0 0 4px #000;
    }

    .player-slot.active {
      border-color: var(--accent-gold);
      box-shadow: 0
